# ═══════════════════════════════════════════════════════════════
# Credit Risk Engine — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
# GitHub Actions workflow for continuous integration & deployment
# Conforme aux pratiques MLOps bancaires
# ═══════════════════════════════════════════════════════════════

name: Credit Risk Engine — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── 1. Code Quality ────────────────────────────────────────
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black pytest

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        run: black --check --line-length 120 .

  # ── 2. Unit Tests ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 3. Risk Engine Integration Tests ───────────────────────
  integration-tests:
    name: Risk Engine Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Generate mock data
        run: python 01_data_layer/mock_home_credit.py

      - name: Run feature engineering
        run: python 01_data_layer/feature_store/feature_engineering.py

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short || true

  # ── 4. Model Validation ────────────────────────────────────
  model-validation:
    name: Model Validation (Smoke Test)
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate mock data & train
        run: |
          python 01_data_layer/mock_home_credit.py
          python 01_data_layer/feature_store/feature_engineering.py

      - name: Validate Risk Engine components
        run: |
          python -c "
          from _03_risk_engine import ExpectedLossCalculator, DecisionEngine, IFRS9StagingEngine, RAROCCalculator
          el = ExpectedLossCalculator()
          r = el.compute(pd=0.05, lgd=0.45, ead=1000000)
          assert r.expected_loss > 0
          print('✓ Risk Engine validation passed')
          "

  # ── 5. Docker Build ────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t credit-risk-engine:latest \
            -f 09_infrastructure/docker/Dockerfile .

      - name: Test Docker health
        run: |
          docker run -d --name test-risk-engine -p 8000:8000 credit-risk-engine:latest
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-risk-engine
          docker rm test-risk-engine
