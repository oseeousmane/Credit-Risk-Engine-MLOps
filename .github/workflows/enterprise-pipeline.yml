name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Backend: NestJS (TypeScript) ───────────────────────────────────────────
  backend-test:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./10_backend_nestjs

    # ── Secret Injection ──────────────────────────────────────────────────────
    # All variables are injected from GitHub repository secrets.
    # Missing or malformed values will be caught by the Joi smoke test below.
    # Required secrets to configure in repository settings:
    #   STAGING_DATABASE_URL, STAGING_DIRECT_URL, STAGING_JWT_SECRET,
    #   STAGING_SESSION_SECRET, STAGING_FRONTEND_URL
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      # SESSION_SECRET must be distinct from JWT_SECRET (Joi enforces min 32 chars)
      SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
      FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL || 'http://localhost:3000' }}
      SCORING_SERVICE_URL: http://localhost:8000
      # Empty in CI → Python runs unauthenticated (dev mode). Set as secret for staging.
      SCORING_API_KEY: ${{ secrets.STAGING_SCORING_API_KEY || '' }}
      PORT: "3001"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '10_backend_nestjs/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Code
        run: npm run lint

      - name: Run Unit Tests (with coverage enforcement)
        run: npm run test:cov

      - name: Build Application
        run: npm run build

      # ── Joi Config Validation Smoke Test ─────────────────────────────────────
      # Boots the compiled app for up to 10 seconds to trigger Joi schema
      # validation. If any required env var is missing or malformed, the process
      # exits non-zero and this step fails — catching the issue in CI before
      # any deployment attempt.
      - name: Joi Config Validation (Smoke Boot)
        run: |
          echo "▶ Booting application to trigger Joi validation..."
          timeout 10s node dist/main.js && echo "Exited cleanly" || EXIT_CODE=$?
          # Exit code 124 = timeout (normal — app was running)
          # Exit code 0   = app exited cleanly (also acceptable in test)
          # Any other code = Joi validation failure or startup crash
          if [ "${EXIT_CODE:-0}" -ne 0 ] && [ "${EXIT_CODE:-0}" -ne 124 ]; then
            echo "❌ Application failed to start — likely a Joi config validation error."
            exit 1
          fi
          echo "✅ Config validation passed."

  # ── Python: Risk Engine (FastAPI + scoring logic) ─────────────────────────
  python-test:
    name: Python CI (Risk Engine)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/03_risk_engine
      SCORING_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run scoring unit tests
        working-directory: ./03_risk_engine
        run: |
          python -m pytest test_scoring.py -v --tb=short \
            --cov=. --cov-report=xml --cov-fail-under=60

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: 03_risk_engine/coverage.xml

  # ── Frontend: Next.js (TypeScript) ────────────────────────────────────────
  frontend-test:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./08_frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '08_frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint -- --max-warnings=0

      - name: Build Frontend Application
        run: npm run build
